<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: head(${title})}">
    <title>Registrar Marcación</title>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside th:replace="~{layout :: sidebar('form')}"></aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header th:replace="~{layout :: header(${title}, 'Registro manual e individual de asistencia')}"></header>

        <!-- Flash alerts -->
        <div th:replace="~{layout :: alerts}"></div>

        <!-- Custom Form styles (restored from original) -->
        <style>
            .form-card {
                max-width: 800px;
                margin: 0 auto;
            }

            .form-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
                margin-bottom: 2rem;
            }

            @media (max-width: 768px) {
                .form-grid {
                    grid-template-columns: 1fr;
                }
            }

            .form-group-full {
                grid-column: span 2;
            }

            @media (max-width: 768px) {
                .form-group-full {
                    grid-column: span 1;
                }
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }

            .form-label {
                font-size: 0.85rem;
                font-weight: 600;
                color: var(--text-primary);
            }

            .form-input {
                padding: 0.625rem 0.875rem;
                border-radius: var(--radius-sm);
                border: 1px solid var(--border-color);
                font-size: 0.9rem;
                font-family: 'Inter', sans-serif;
                color: var(--text-primary);
                transition: var(--transition);
                background-color: #ffffff;
            }

            .form-input:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            }

            .form-input:disabled {
                background-color: var(--bg-body);
                color: var(--text-secondary);
                cursor: not-allowed;
                border-style: dashed;
                opacity: 0.85;
            }

            .form-section-title {
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--primary);
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 0.5rem;
                margin-bottom: 1rem;
                grid-column: span 2;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }

            @media (max-width: 768px) {
                .form-section-title {
                    grid-column: span 1;
                }
            }
            
            .time-hint {
                font-size: 0.75rem;
                color: var(--text-secondary);
                margin-top: -0.25rem;
            }
        </style>

        <div class="card form-card">
            <div class="card-header">
                <h3 class="card-title" th:text="${title}">Registrar Marcación</h3>
            </div>
            
            <form th:action="@{/marcaciones/guardar}" th:object="${marcacion}" method="POST">
                <!-- Hidden ID for edit mode -->
                <input type="hidden" th:field="*{id}">
                
                <div class="form-grid">
                    <!-- Section 1: Personal Info -->
                    <h4 class="form-section-title"><i class="fa-solid fa-user"></i> Datos del Empleado</h4>
                    
                    <div class="form-group">
                        <label class="form-label" for="cedula">Cédula de Identidad *</label>
                        <input type="text" id="cedula" th:field="*{cedula}" class="form-input" placeholder="Ej. 124578" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="fecha">Fecha de Marcación *</label>
                        <input type="date" id="fecha" name="fecha" th:value="*{fecha != null ? #temporals.format(fecha, 'yyyy-MM-dd') : ''}" class="form-input" required>
                    </div>

                    <div class="form-group form-group-full">
                        <label class="form-label" for="nombre">Nombre Completo *</label>
                        <input type="text" id="nombre" th:field="*{nombre}" class="form-input" placeholder="Ej. Juan Perez" required>
                    </div>

                    <!-- Section 2: Hours -->
                    <h4 class="form-section-title" style="margin-top: 1rem;"><i class="fa-solid fa-clock"></i> Registro de Horarios</h4>
                    
                    <div class="form-group">
                        <label class="form-label" for="horaEntrada">Hora de Entrada</label>
                        <input type="time" id="horaEntrada" name="horaEntrada" th:value="*{horaEntrada != null ? #temporals.format(horaEntrada, 'HH:mm') : ''}" class="form-input">
                        <span class="time-hint">Horario normal: 07:00 AM</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="horaSalidaAlmuerzo">Salida de Almuerzo</label>
                        <input type="time" id="horaSalidaAlmuerzo" name="horaSalidaAlmuerzo" th:value="*{horaSalidaAlmuerzo != null ? #temporals.format(horaSalidaAlmuerzo, 'HH:mm') : ''}" class="form-input">
                        <span class="time-hint">Horario normal: 12:00 PM</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="horaEntradaAlmuerzo">Entrada de Almuerzo</label>
                        <input type="time" id="horaEntradaAlmuerzo" name="horaEntradaAlmuerzo" th:value="*{horaEntradaAlmuerzo != null ? #temporals.format(horaEntradaAlmuerzo, 'HH:mm') : ''}" class="form-input">
                        <span class="time-hint">Horario normal: 13:00 PM (01:00 PM)</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="horaSalidaLaboral">Hora de Salida Laboral</label>
                        <input type="time" id="horaSalidaLaboral" name="horaSalidaLaboral" th:value="*{horaSalidaLaboral != null ? #temporals.format(horaSalidaLaboral, 'HH:mm') : ''}" class="form-input">
                        <span class="time-hint">Horario normal: 17:00 PM (05:00 PM)</span>
                    </div>

                    <div class="form-group form-group-full">
                        <label class="form-label" for="observaciones">Observación / Motivo de Modificación *</label>
                        <textarea id="observaciones" th:field="*{observaciones}" class="form-input" style="min-height: 80px; resize: vertical; width: 100%; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.65rem 0.75rem; font-family: inherit;" placeholder="Ej. Olvidó marcar la salida / Corrección de entrada" required></textarea>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
                    <a href="/marcaciones" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Marcación
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Layout Scripts -->
    <th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
