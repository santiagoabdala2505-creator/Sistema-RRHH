<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout :: head('Legajo de Personal')}">
    <title>Legajo de Personal</title>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside th:replace="~{layout :: sidebar('legajos')}"></aside>

    <!-- Main Wrapper -->
    <div class="main-wrapper">
        <!-- Header -->
        <header th:replace="~{layout :: header('Legajo de Personal', 'Gestión y archivo digital de legajos de empleados')}"></header>

        <!-- Flash alerts -->
        <div th:replace="~{layout :: alerts}"></div>

        <!-- Custom Legajos Grid Layout -->
        <div style="display: grid; grid-template-columns: 3fr 2fr; gap: 2rem;">
            
            <!-- Left Side: Files List -->
            <div>
                <div class="card" style="padding: 0; overflow: hidden; height: 100%;">
                    <div class="card-header" style="padding: 1.5rem 1.75rem;">
                        <h3 class="card-title" style="margin-bottom: 0;"><i class="fa-solid fa-folder-open" style="color: var(--primary); margin-right: 0.5rem;"></i> Legajos Guardados</h3>
                    </div>
                    
                    <div style="overflow-x: auto; padding: 0.5rem 0;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                            <thead>
                                <tr style="background-color: var(--bg-body); border-bottom: 1px solid var(--border-color);">
                                    <th style="padding: 1rem 1.5rem; font-weight: 600; color: var(--text-secondary);">Nombre / Empleado</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600; color: var(--text-secondary);">Nombre del Archivo</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600; color: var(--text-secondary); width: 140px; text-align: center;">Fecha de Subida</th>
                                    <th style="padding: 1rem 1.5rem; font-weight: 600; color: var(--text-secondary); width: 130px; text-align: center;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${#lists.isEmpty(legajos)}" style="border-bottom: 1px solid var(--border-color);">
                                    <td colspan="4" style="padding: 3rem 1.5rem; text-align: center; color: var(--text-secondary);">
                                        <i class="fa-solid fa-folder-open" style="font-size: 2.5rem; color: var(--border-color); margin-bottom: 1rem; display: block;"></i>
                                        No se han subido legajos todavía.
                                    </td>
                                </tr>
                                <tr th:each="l : ${legajos}" style="border-bottom: 1px solid var(--border-color); transition: var(--transition);" onmouseover="this.style.backgroundColor='rgba(0,0,0,0.01)'" onmouseout="this.style.backgroundColor='transparent'">
                                    <td style="padding: 1rem 1.5rem; font-weight: 600; color: var(--dark);" th:text="${l.nombre}">Juan Perez</td>
                                    <td style="padding: 1rem 1.5rem; color: var(--text-secondary); font-size: 0.85rem;" th:text="${l.nombreArchivo}">documento.pdf</td>
                                    <td style="padding: 1rem 1.5rem; text-align: center; color: var(--text-secondary); font-size: 0.85rem;" th:text="${#temporals.format(l.fechaSubida, 'dd/MM/yyyy HH:mm')}">20/07/2026 10:00</td>
                                    <td style="padding: 1rem 1.5rem; text-align: center;">
                                        <div style="display: flex; gap: 0.35rem; justify-content: center;">
                                            <a th:href="@{/legajos/descargar/{id}(id=${l.id})}" class="btn btn-sm" style="background-color: var(--primary-light); color: var(--primary-hover); padding: 0.35rem 0.65rem;" title="Descargar PDF">
                                                <i class="fa-solid fa-file-pdf"></i> Descargar
                                            </a>
                                            <a th:href="@{/legajos/eliminar/{id}(id=${l.id})}" class="btn btn-sm btn-secondary" style="padding: 0.35rem 0.65rem;" title="Eliminar" onclick="return confirm('¿Está seguro de eliminar este legajo?');">
                                                <i class="fa-solid fa-trash" style="color: var(--danger);"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Right Side: Upload Form -->
            <div>
                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title"><i class="fa-solid fa-file-shield" style="color: var(--primary); margin-right: 0.5rem;"></i> Subir Nuevo Legajo</h3>
                    </div>
                    
                    <form action="/legajos/subir" method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label for="nombre" style="font-size: 0.85rem; font-weight: 600; color: var(--dark);">Nombre / Empleado *</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Perez - Legajo 2026" required 
                                   style="padding: 0.65rem 0.75rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 0.9rem; font-family: inherit; width: 100%;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <label style="font-size: 0.85rem; font-weight: 600; color: var(--dark);">Archivo PDF *</label>
                            
                            <!-- Custom drop zone style file select -->
                            <div id="dropZone" style="border: 2px dashed #cbd5e1; border-radius: var(--radius-md); padding: 2.5rem 1rem; text-align: center; background-color: #f8fafc; cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                                <i class="fa-solid fa-file-pdf" id="pdfIcon" style="font-size: 2.5rem; color: #94a3b8; transition: var(--transition);"></i>
                                <span id="dropZoneText" style="font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);">Seleccionar o arrastrar PDF</span>
                                <span style="font-size: 0.75rem; color: #94a3b8;">Tamaño máximo 50MB</span>
                            </div>
                            
                            <input type="file" id="fileInput" name="archivo" accept="application/pdf" style="display: none;" required>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem; margin-top: 0.5rem;">
                            <button type="submit" class="btn btn-primary" id="btnSubmit" disabled style="width: 100%;">
                                <i class="fa-solid fa-cloud-arrow-up"></i> Guardar Legajo
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Layout Scripts -->
    <th:block th:replace="~{layout :: scripts}"></th:block>

    <!-- Specific Legajo upload script -->
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const dropZoneText = document.getElementById('dropZoneText');
        const pdfIcon = document.getElementById('pdfIcon');
        const btnSubmit = document.getElementById('btnSubmit');

        if (dropZone && fileInput) {
            // Trigger file selection on click
            dropZone.addEventListener('click', () => fileInput.click());

            // Handle file selection
            fileInput.addEventListener('change', handleFileSelect);

            // Drag and drop events
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = 'var(--primary)';
                    dropZone.style.backgroundColor = 'rgba(79, 70, 229, 0.02)';
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.style.borderColor = '#cbd5e1';
                    dropZone.style.backgroundColor = '#f8fafc';
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    // Check if file is PDF
                    if (files[0].type === "application/pdf" || files[0].name.toLowerCase().endsWith(".pdf")) {
                        fileInput.files = files;
                        handleFileSelect();
                    } else {
                        alert("Por favor suba únicamente archivos en formato PDF.");
                    }
                }
            });
        }

        function handleFileSelect() {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                dropZoneText.innerHTML = `<strong>Archivo seleccionado:</strong><br>${file.name}`;
                dropZoneText.style.color = 'var(--primary-hover)';
                pdfIcon.style.color = 'var(--danger)';
                btnSubmit.disabled = false;
            } else {
                dropZoneText.textContent = "Seleccionar o arrastrar PDF";
                dropZoneText.style.color = 'var(--text-secondary)';
                pdfIcon.style.color = '#94a3b8';
                btnSubmit.disabled = true;
            }
        }
    </script>

</body>
</html>
