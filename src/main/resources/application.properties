server.port=${PORT:8081}
spring.thymeleaf.cache=false

# Limpia sin usuario ni contraseña incrustados
spring.datasource.url=jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.xduntjglfttgtnnkgyuo}
spring.datasource.password=Abdala250305
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración robusta de HikariCP para pool de Supabase (evita 'Connection is closed')
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=15000
spring.datasource.hikari.connection-test-query=SELECT 1

# Forzar a Hibernate a no bloquear el inicio si tarda en conectar
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Límites de tamaño para carga de archivos masivos
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Optimización de rendimiento para inserciones en lote (Batch Inserts)
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Tiempo de espera máximo para peticiones pesadas (5 minutos)
server.tomcat.connection-timeout=300000

# Evitar HTTP ERROR 413: Permitir formularios y subidas POST de hasta 200MB en Tomcat
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB